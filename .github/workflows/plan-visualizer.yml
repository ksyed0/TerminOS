name: Plan Visualizer

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
    paths:
      - 'Docs/RELEASE_PLAN.md'
      - 'Docs/TEST_CASES.md'
      - 'Docs/BUGS.md'
      - 'Docs/AI_COST_LOG.md'
      - 'progress.md'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  generate-and-deploy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout (full history for burndown)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage
        env:
          CI: true

      - name: Generate plan-status.html
        run: |
          node tools/generate-plan.js
          mkdir -p _site
          cp Docs/plan-status.html _site/index.html
          cp Docs/plan-status.json _site/plan-status.json 2>/dev/null || true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
